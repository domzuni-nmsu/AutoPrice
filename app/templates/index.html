<!-- app/templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Car Price Predictor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f4f9; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; padding: 30px; background-color: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box; /* Important */
            transition: border-color 0.3s;
        }
        input:focus, select:focus { border-color: #3498db; outline: none; }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .submit-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Car Price Prediction</h1>
        <form action="/predict" method="post">
            
            <div class="form-group">
                <label for="brand">Brand</label>
                <!-- This should be populated with brands from your dataset for best results -->
                <select id="brand" name="brand" required>
                    <option value="ford">Ford</option>
                    <option value="chevrolet">Chevrolet</option>
                    <option value="nissan">Nissan</option>
                    <option value="dodge">Dodge</option>
                    <!-- Add more brands as needed -->
                </select>
            </div>

            <div class="form-group">
                <label for="model_year">Model Year</label>
                <input type="number" id="model_year" name="model_year" placeholder="e.g., 2018" required>
            </div>

            <div class="form-group">
                <label for="milage">Mileage</label>
                <input type="number" id="milage" name="milage" placeholder="e.g., 50000" required>
            </div>

            <div class="form-group">
                <label for="fuel_type">Fuel Type</label>
                <select id="fuel_type" name="fuel_type" required>
                    <option value="Gasoline">Gasoline</option>
                    <option value="E85 Flex Fuel">E85 Flex Fuel</option>
                    <option value="Diesel">Diesel</option>
                    <option value="Hybrid">Hybrid</option>
                </select>
            </div>

            <div class="form-group">
                <label for="transmission">Transmission</label>
                <select id="transmission" name="transmission" required>
                    <option value="Automatic">Automatic</option>
                    <option value="Manual">Manual</option>
                </select>
            </div>

            <!-- Hidden fields for simplicity, can be expanded into form elements -->
            <input type="hidden" name="accident" value="None">
            <input type="hidden" name="clean_title" value="Yes">

            <button type="submit" class="submit-btn">Predict Price</button>
        </form>
    </div>
</body>
</html>
