<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Car Price Predictor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f4f9; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; padding: 30px; background-color: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="number"], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .submit-btn { display: block; width: 100%; padding: 15px; border: none; background-color: #3498db; color: white; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Car Price Prediction</h1>
        <form action="/predict" method="post">
            
            <div class="form-group">
                <label for="brand">Brand</label>
                <select id="brand" name="brand" required>
                    {% for brand in brands %}
                        <option value="{{ brand }}">{{ brand }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <select id="model" name="model" required></select>
            </div>
            
            <div class="form-group">
                <label for="transmission">Transmission</label>
                <select id="transmission" name="transmission" required></select>
            </div>

            <div class="form-group">
                <label for="model_year">Model Year</label>
                <input type="number" id="model_year" name="model_year" placeholder="e.g., 2018" required>
            </div>

            <div class="form-group">
                <label for="milage">Mileage</label>
                <input type="number" id="milage" name="milage" placeholder="e.g., 50000" required>
            </div>

            <div class="form-group">
                <label for="fuel_type">Fuel Type</label>
                <select id="fuel_type" name="fuel_type" required>
                    {% for type in fuel_types %}
                        <option value="{{ type }}">{{ type }}</option>
                    {% endfor %}
                </select>
            </div>

            <input type="hidden" name="accident" value="None reported">
            <input type="hidden" name="clean_title" value="Yes">

            <button type="submit" class="submit-btn">Predict Price</button>
        </form>
    </div>

    <script>
        // Use the |tojson filter to safely get the data from Python
        const modelsData = {{ brand_to_models_map | tojson }};
        const transmissionsData = {{ brand_model_to_trans_map | tojson }};

        const brandSelect = document.getElementById('brand');
        const modelSelect = document.getElementById('model');
        const transmissionSelect = document.getElementById('transmission');

        function updateTransmissions() {
            const selectedBrand = brandSelect.value;
            const selectedModel = modelSelect.value;
            const transmissions = (transmissionsData[selectedBrand] && transmissionsData[selectedBrand][selectedModel]) || [];
            
            transmissionSelect.innerHTML = '';
            transmissions.forEach(function(trans) {
                const option = document.createElement('option');
                option.value = trans;
                option.textContent = trans;
                transmissionSelect.appendChild(option);
            });
        }

        function updateModels() {
            const selectedBrand = brandSelect.value;
            const models = modelsData[selectedBrand] || [];
            
            modelSelect.innerHTML = '';
            models.forEach(function(model) {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                modelSelect.appendChild(option);
            });
            // After updating models, immediately update transmissions for the new first model
            updateTransmissions();
        }
        
        // Add event listeners to call the update functions whenever a selection changes
        brandSelect.addEventListener('change', updateModels);
        modelSelect.addEventListener('change', updateTransmissions);

        // Initial population on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateModels();
        });
    </script>
</body>
</html>
